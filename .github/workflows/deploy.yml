# Builds the app and publishes it to GitHub Pages on every push to main.
# Enable it in the repo: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A few commits of history, for "What's new" in the app.
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser smoke tests at phone size against the build; a failure stops the deploy.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      # Reference screenshots: reported, but they don't block a deploy (a different machine can
      # render a pixel differently); the diff images are in the uploaded report.
      - run: npm run e2e:visual
        continue-on-error: true
        id: visual
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: steps.visual.outcome == 'failure'
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
